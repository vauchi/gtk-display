[package]
name = "vauchi-gtk"
version = "0.8.2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "GTK4 + libadwaita renderer for Vauchi's generic presentation commands"

[features]
default = ["audio", "ble", "camera", "mdns"]
audio = ["dep:tokio", "dep:vauchi-hardware", "vauchi-hardware/audio"]
ble = ["dep:bluer", "dep:tokio", "dep:vauchi-hardware"]
camera = ["dep:tokio", "dep:vauchi-hardware", "vauchi-hardware/camera"]
nfc = ["dep:tokio", "dep:vauchi-hardware", "vauchi-hardware/nfc"]
mdns = ["dep:mdns-sd"]

[dependencies]
vauchi-contract = { git = "https://gitlab.com/vauchi/contract.git", tag = "v0.97.0", version = "^0.97" }
vauchi-core = { git = "https://gitlab.com/vauchi/core.git", tag = "v0.99.1", version = "=0.99.1", features = ["secure-storage-linux"] }
vauchi-app = { git = "https://gitlab.com/vauchi/core.git", tag = "v0.99.1", version = "=0.99.1", default-features = false, features = ["network", "content-updates"] }
# The Linux hardware shell (ADR-077), pinned by tag like Core; the key keeps
# the old crate name so the source files that import it are unchanged.
vauchi-hardware = { package = "vauchi-linux-hw", git = "https://gitlab.com/vauchi/linux-hw.git", tag = "v0.98.0", version = "=0.98.0", optional = true }
gtk4 = { version = "0.9", features = ["v4_10"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
qrcode = { version = "0.14", default-features = false }
# Decodes golden ScreenModel fixtures in the `render-fixture` catalog harness.
serde_json = "1"
# Registers data/fonts/ with this process's Fontconfig (FcConfigAppFontAddDir)
# so the brand type ramp renders without installing the fonts system-wide.
yeslogic-fontconfig-sys = "6"

# Audio proximity (ultrasonic via CPAL) — enabled by default
# Uses CpalAudioBackend from vauchi-core

# BLE exchange — tokio runtime is portable; bluer itself is target-gated below.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }

# Camera QR scanning — nokhwa is target-gated below; decoding lives in core.

# NFC exchange via PC/SC (pcsclite) — optional, requires USB NFC reader

# mDNS/DNS-SD discovery for USB exchange (finds phone IP on local network)
mdns-sd = { version = "0.11", optional = true }

# Linux-only deps: `bluer` (BlueZ D-Bus, optional) and `nokhwa` with the
# `input-v4l` feature (Video4Linux). Target-gating keeps `cargo clippy`
# green on non-Linux dev machines without dropping `ble`/`camera` from
# the default build on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"], optional = true }

[package.metadata.cargo-machete]
ignored = ["nokhwa", "pcsc", "yeslogic-fontconfig-sys"]  # optional feature deps; fontconfig-sys is used as `fontconfig_sys`

[build-dependencies]
# Compiles data/resources.gresource.xml (the bundled pictograms) into the
# binary; needs `glib-compile-resources` from the GLib dev tools.
glib-build-tools = "0.20"

[dev-dependencies]
tempfile = "3.0"
vauchi-hardware = { package = "vauchi-linux-hw", git = "https://gitlab.com/vauchi/linux-hw.git", tag = "v0.98.0", version = "=0.98.0", features = ["fake-bluez"] }

# Release profile: optimized binary (matches cli/tui)
[profile.release]
lto = true
strip = true
panic = "abort"
overflow-checks = true

# Development profile: fast builds, backtraces work (matches core)
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Test profile: skip full debug info, reduce binary size ~60%
[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"

# rqrr 0.11.0 with the clamped Perspective::map (vauchi/utils/rqrr): a
# [patch] applies only inside the workspace that declares it, so without
# this stanza the crate resolved upstream rqrr from crates.io — the
# unclamped abort path — and `panic = "abort"` turned a marginal camera
# frame into a process kill. Same tag as core and linux-hw.
# tests/rqrr_patch_reaches_this_shell.rs fails the moment this is lost.
# Record: _private/docs/problems/done/2026-09-10-linux-gtk-unpatched-rqrr-abort-path/
[patch.crates-io]
rqrr = { git = "https://gitlab.com/vauchi/utils/rqrr.git", tag = "v0.11.0+vauchi.1" }
