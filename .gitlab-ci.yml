# GitLab CI for vauchi-gtk, the GTK4 renderer (ADR-078 gtk-display); the
# gvauchi app, its packages and screenshots are built in linux-app.
#
# Uses shared templates from vauchi/scripts for self-hosted runner setup,
# caching, and change-based rules.

include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.11.09
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/allow-git.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/shell-command-conformance.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/perf.yml'
      - '/ci-templates/content-fetch.yml'
      - '/ci-templates/removed-symbols.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/freshness.yml'
      - '/ci-templates/github-mirror.yml'
      - '/ci-templates/coverage.yml'
      - '/ci-templates/verified-fetch.yml'
      - '/ci-templates/tool-install.yml'
      - '/ci-templates/cross-cutting-lint.yml'
      - '/ci-templates/domain-calls.yml'

  - project: 'vauchi/scripts'
    ref: c4bfaba28e6182e30de1bef7e4ab7af1e6dd048f
    file:
      - '/ci-templates/design-drift.yml'
      - '/ci-templates/parser-parity.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.11.09"

stages:
  - auto-tag
  - lint
  - build
  - test
  - security
  - verify
  - deploy

# A version bump merged to main is the release: the job pushes
# v<Cargo.toml version> when that tag does not exist yet, so the tag always
# sits on the merged commit (private#1045).
auto-tag:version:
  extends: .auto-tag

# Cross-cutting lint bundle: docs gate + locale-key-coverage + design-tokens + humble.
# All checks run sequentially in one docker job to reduce runner scheduling overhead.
lint:cross-cutting-blocking:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-alpine
  tags: [docker]
  needs: []
  allow_failure: false
  before_script:
    - apk add --no-cache bash ripgrep jq git findutils grep curl
    # Always start from a fresh clone of locales/main. GitLab runners
    # preserve `../locales` across job retries on the same machine, and
    # `git fetch --depth=1 + reset --hard origin/main` does NOT reliably
    # refresh the worktree to the new tip. The 5 MB re-clone takes ~2 s;
    # cache-trust is not worth the flake.
    - |
      rm -rf ../locales
      git clone --depth=1 https://gitlab.com/vauchi/locales.git ../locales
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fcheck-design-tokens.sh/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o check-design-tokens.sh
      chmod +x check-design-tokens.sh
    - mkdir -p .ratchet-scripts
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check.py/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check.py
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check_rules.json/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check_rules.json
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check.baseline.json/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check.baseline.json
  script:
    - echo "Running cross-cutting blocking lint bundle."
    - bash ../locales/scripts/check-locale-key-coverage.sh src ../locales '*.rs'
    - ./check-design-tokens.sh --strict src/
    - python3 .ratchet-scripts/humble_check.py --repo "${CI_PROJECT_NAME}" --repo-path "${CI_PROJECT_DIR}" --config .ratchet-scripts/humble_check_rules.json --check .ratchet-scripts/humble_check.baseline.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Blocks MRs with non-main branch refs in Cargo.toml git dependencies.
check:branch-refs:
  extends: .check-git-branch-refs

# Duplicate dependency check (advisory)
lint:duplicates:
  extends: [.linux-runner-nocache, .lint-duplicates-job, .timeout-quick]

# Unused dependency check (advisory)
lint:machete:
  extends: [.linux-runner-nocache, .lint-machete-job, .timeout-quick]

lint:format:
  extends: [.linux-runner, .lint-format, .validation-rust, .timeout-quick]

lint:clippy:
  extends: [.linux-runner, .lint-clippy, .validation-rust, .timeout-cold-rebuild]
  needs: []
  before_script:
    - !reference [.self-hosted, before_script]

build:app:
  extends: [.linux-runner, .timeout-cold-rebuild]
  stage: build
  needs:
    - job: lint:format
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
  script:
    - cargo build --release --bin render_fixture
  artifacts:
    paths:
      - target/release/render_fixture
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:unit:
  extends: [.linux-runner, .timeout-cold-rebuild]
  stage: test
  needs:
    - job: lint:format
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
  script:
    - cargo nextest run --profile ci
  # GTK4 dev libs required on runners — enforced to surface infra gaps
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"
          - ".gitlab-ci.yml"
          - "rust-toolchain.toml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The renderer replays the contract's fixture corpus on every MR, with no
# engine behind it (ADR-078 D-11).
contract:replay:
  extends: [.linux-runner, .timeout-cold-rebuild]
  stage: test
  needs:
    - job: lint:format
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
  script:
    - cargo nextest run --profile ci --test contract_replay
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# AT-SPI accessibility + widget tree tests of the renderer, each surface
# rendered by render_fixture with no engine
test:a11y:
  stage: test
  needs:
    - job: build:app
  tags: [linux, self-hosted]
  # Self-heal residual AT-SPI startup-timing flakes. The Cairo-renderer
  # fix in run-tests.sh removes the GPU/DRI3 cause; retry absorbs the rare
  # remaining "did not appear on the AT-SPI tree within Ns" race. A real
  # regression still fails all attempts, so this cannot mask a true break.
  retry:
    max: 2
    when:
      - script_failure
      - stuck_or_timeout_failure
      - runner_system_failure
  script:
    - chmod +x tests/atspi/run-tests.sh
    - tests/atspi/run-tests.sh -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "src/**/*"
          - "tests/atspi/**/*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

coverage:workspace:
  extends: [.coverage-job, .linux-runner, .timeout-cold-rebuild]
  before_script:
    - !reference [.self-hosted, before_script]
    - sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev 2>/dev/null || true
  variables:
    COVERAGE_REPO_LABEL: "linux-gtk"
    COVERAGE_EXTRA_FLAGS: "--no-default-features"

# ============================================================
# Security Stage (change-based, parallel with test)
# ============================================================

# Semgrep SAST: gate on Rust changes
semgrep-sast:
  allow_failure: false
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

secret_detection:
  allow_failure: false
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Rust security audit (runs on dependency changes)
security:audit:
  extends: [.linux-runner-readonly, .security-audit-job]

# Full cargo-deny check: advisories, licenses, bans, sources
security:deny:
  extends: [.linux-runner-readonly, .security-deny-job]

# deny.toml's git sources match the reviewed list in vauchi/scripts
# policy/allowed-git-sources.txt (vauchi/private#1162).
check:allow-git:
  extends: [.allow-git-drift-job]

# cargo-vet: every dependency audited or an honest exemption (VSC01)
security:vet:
  extends: [.linux-runner-readonly, .security-vet-job]

# Binary size tracking (main merges + release tags)
perf:binary-size:
  extends: [.binary-size-tracking-job, .linux-runner, .timeout-cold-rebuild]
  before_script:
    - !reference [.self-hosted, before_script]
  variables:
    BINARY_SIZE_REPO_LABEL: "linux-gtk"

# Presentation drift: verify every canonical presentation node is rendered.
check:design-drift:
  extends: .design-drift-job
  variables:
    DESIGN_DRIFT_PROTOCOL: "presentation"
    DESIGN_DRIFT_MATCH_MODE: "grep"
    DESIGN_DRIFT_GREP_FILE: "src/core_ui/generic_surface"
    CONTRACT_PIN_FILE: "Cargo.toml"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "src/core_ui/generic_surface/**/*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "src/core_ui/generic_surface/**/*"
          - ".gitlab-ci.yml"

# Parser parity against the display shell's pinned contract enum.
check:parser-parity:
  extends: .parser-parity-job
  variables:
    FRONTEND_NAME: "linux-gtk"
    PARSER_FILE: "src/core_ui/generic_surface"
    PARSER_PROTOCOL: "presentation"
    PARSER_SCRIPT_REF: "ci-templates-v2026.11.06"
    CONTRACT_PIN_FILE: "Cargo.toml"

# Removed symbols: detect stale references to removed features
check:removed-symbols:
  extends: .removed-symbols-job
  variables:
    SEARCH_DIRS: "src/ tests/"

# Exact-zero release gate (ADR-066) on release tags, the template's rule.
release:ratchet-zero:
  extends: .release-ratchet-zero

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages

github-mirror:
  extends: .github-mirror

# Fails if this shell renders an overlay it cannot close. Core opens a
# menu with PresentOverlay and closes it with DismissOverlay; a shell
# handling only the first leaves the menu over the destination and
# reports nothing, because an unhandled command becomes a generic
# effect. Shipped on Android, on iOS at priority critical, and on
# web-demo before this existed.
#
# Gaps that are not defects go in .shell-command-conformance-allowlist
# at this repo's root, with a mandatory reason.
check:shell-command-conformance:
  extends: .shell-command-conformance
  # Set here as well as in the template. The template shipped without
  # runner tags, so the job sat pending with no runner (tui!540); the
  # fix is scripts!521, but this repo does not pick it up until the
  # pinned ref moves. Remove once this repo is on a tag that carries it.
  tags: [docker]
  variables:
    VAUCHI_SHELL: linux-gtk

# Pictogram copies match the vauchi/assets commit in pictograms/REVISION
# (#476): a hand edit or a half update fails here, while assets moving on
# never turns an unrelated MR red; the second job says when it has.
.pictogram-copies:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  variables:
    PICTOGRAM_FORMAT: "gtk"
    PICTOGRAM_COPIES: "data/icons/scalable/actions/pictogram-{group}-{name}-symbolic.svg"
  before_script:
    - apk add --no-cache python3 git
    - git clone --quiet https://gitlab.com/vauchi/assets.git /tmp/assets

check:pictogram-copies:
  extends: .pictogram-copies
  script:
    - git -C /tmp/assets checkout --quiet "$(cat pictograms/REVISION)"
    - python3 /tmp/assets/pictograms/check-copies.py --assets /tmp/assets --format "$PICTOGRAM_FORMAT" --copies "$PICTOGRAM_COPIES"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check:pictogram-copies-current:
  extends: .pictogram-copies
  allow_failure: true
  script:
    - python3 /tmp/assets/pictograms/check-copies.py --assets /tmp/assets --format "$PICTOGRAM_FORMAT" --copies "$PICTOGRAM_COPIES" --behind "$(cat pictograms/REVISION)"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Humble UI (ADR-021/043) and VRS02 (ADR-066): fail an MR that adds a
# domain-mutating call or a form-factor branch beyond .audit-baseline.json.
# The template defaults VAUCHI_SCRIPTS_REF to main; pin it to the include.
lint:domain-calls:
  extends: .domain-calls-job
  variables:
    VAUCHI_SCRIPTS_REF: "ci-templates-v2026.11.06"
