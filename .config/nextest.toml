[profile.ci.junit]
# Path is relative to nextest's output dir (target/nextest/ci/), not project root.
path = "junit.xml"

# Keep headless smoke tests isolated: concurrent Xvfb servers have caused
# startup/teardown failures in the supported runner environments.
[test-groups]
xvfb = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(render_fixture_smoke) | binary(camera_preview_widget)'
test-group = 'xvfb'
